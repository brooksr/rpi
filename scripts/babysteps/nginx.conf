# BabySteps static site. /srv is ~/babysteps/www on the Pi; `current` is a
# symlink update.sh swaps to the newest build.
server {
  listen 80;
  root /srv/current;
  index index.html;

  # Hashed bundles never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The shell, service worker and manifest must be re-checked on every load, or
  # a new build would hide behind the old one.
  location ~ ^/(index\.html|sw\.js|manifest\.webmanifest|version\.json)$ {
    add_header Cache-Control "no-cache";
  }

  # The events API (container "babysteps-events"): POST /api/events lets voice
  # assistants and Home Assistant log an entry. Longest prefix wins, so this
  # takes /api/events ahead of the broker's /api/ below. It checks its own
  # bearer token; nothing here is open just because it is proxied.
  location /api/events {
    resolver 127.0.0.11 valid=30s;
    set $events http://babysteps-events:8788;
    proxy_pass $events;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The nursery sensor phone (oneplus project) posts numeric sound summaries to
  # the same container, which upserts them into the sheet's four Nursery tabs.
  # It checks its own NURSERY_API_TOKEN. Batches run to ~180 KB.
  location = /api/nursery {
    resolver 127.0.0.11 valid=30s;
    set $events http://babysteps-events:8788;
    client_max_body_size 256k;
    proxy_pass $events;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The token broker (container "babysteps-broker" on the "babysteps" docker
  # network): one-time Google sign-in. Resolved per request through Docker's
  # DNS, so nginx still starts, and the site still serves, while it is down.
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $broker http://babysteps-broker:8787;
    proxy_pass $broker;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}

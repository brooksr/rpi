# LCARS controls used by the upstream theme and its JavaScript.
frontend:
  extra_module_url:
    - /local/community/lcars/font-loader.js
input_boolean:
  lcars_sound:
    name: LCARS Sound
    icon: mdi:volume-high
    initial: false
  lcars_texture:
    name: LCARS Texture
    icon: mdi:texture
    initial: false
input_number:
  lcars_vertical:
    name: LCARS Vertical
    min: 26
    max: 60
    step: 1
    initial: 40
  lcars_horizontal:
    name: LCARS Horizontal
    min: 6
    max: 60
    step: 1
    initial: 20
  lcars_menu_font:
    name: LCARS Menu Font
    min: 16
    max: 40
    step: 1
    initial: 24
sensor:
  - platform: time_date
    display_options:
      - time
# Keep the live header clock without storing a new history row every minute.
recorder:
  exclude:
    entities:
      - sensor.time
logbook:
  exclude:
    entities:
      - sensor.time
automation:
  - id: lcars_default_theme
    alias: LCARS TNG default theme
    triggers:
      - trigger: homeassistant
        event: start
    actions:
      - action: frontend.set_theme
        data:
          name: LCARS TNG
          mode: dark

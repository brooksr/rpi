# Clean: neutral surfaces, one blue accent, system fonts, borders instead of shadows.
Clean:
  # Type: the device's own UI font (SF on Apple, Segoe on Windows, Roboto on Android).
  ha-font-family-body: '-apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  ha-font-family-heading: var(--ha-font-family-body)
  primary-font-family: var(--ha-font-family-body)
  paper-font-common-base_-_font-family: var(--ha-font-family-body)
  ha-font-smoothing: antialiased
  ha-card-header-font-family: var(--ha-font-family-heading)
  ha-card-header-font-size: 18px

  # Shape: soft corners, flat cards with a hairline border.
  ha-card-border-radius: 16px
  ha-card-border-width: 1px
  ha-card-box-shadow: none
  ha-dialog-border-radius: 20px

  # Accent scale (05 darkest, 95 lightest).
  ha-color-primary-05: "#0a1633"
  ha-color-primary-10: "#102452"
  ha-color-primary-20: "#1a3a7f"
  ha-color-primary-30: "#1e4fb0"
  ha-color-primary-40: "#2563eb"
  ha-color-primary-50: "#3b82f6"
  ha-color-primary-60: "#60a5fa"
  ha-color-primary-70: "#93c5fd"
  ha-color-primary-80: "#bfdbfe"
  ha-color-primary-90: "#dbeafe"
  ha-color-primary-95: "#eff6ff"

  modes:
    light:
      primary-color: "#2563eb"
      rgb-primary-color: 37, 99, 235
      accent-color: "#2563eb"
      rgb-accent-color: 37, 99, 235
      primary-background-color: "#f4f5f7"
      secondary-background-color: "#eceef2"
      lovelace-background: "#f4f5f7"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      ha-card-border-color: "#e3e6eb"
      divider-color: "#e3e6eb"
      primary-text-color: "#111827"
      rgb-primary-text-color: 17, 24, 39
      secondary-text-color: "#566070"
      disabled-text-color: "#9aa1ad"
      text-primary-color: "#ffffff"
      ha-card-header-color: "#111827"
      ha-color-text-primary: "#111827"
      ha-color-text-secondary: "#566070"
      ha-color-text-link: "#1d4ed8"
      ha-color-surface-default: "#ffffff"
      ha-color-surface-low: "#f4f5f7"
      ha-color-surface-lower: "#eceef2"
      state-icon-color: "#566070"
      app-header-background-color: "#f4f5f7"

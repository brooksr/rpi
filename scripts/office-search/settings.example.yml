use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - duckduckgo
      - brave
      - wikipedia
server:
  secret_key: REPLACE_WITH_RANDOM_SECRET
  limiter: false
  image_proxy: false
search:
  safe_search: 1
  formats:
    - html
    - json
outgoing:
  request_timeout: 8
